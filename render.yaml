# Fixora Render blueprint
# Neon is used as the database, so no Render PostgreSQL add-on is created.

services:
  - type: web
    name: fixora-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: ./backend/api
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Fixora
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_MAINTENANCE_DRIVER
        value: file
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-orange-union-azb3pw6z.c-3.ap-southeast-1.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"

      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: FIXORA_ADMIN_CODE
        sync: false
      - key: FIXORA_MAINTENANCE_CODE
        sync: false

  - type: web
    name: fixora-web
    runtime: static
    plan: free
    region: singapore
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render injects the public API URL at BUILD time, so the React bundle
      # always calls the correct backend. No manual URL needed.
      - key: VITE_API_URL
        fromService:
          name: fixora-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
